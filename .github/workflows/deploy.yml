name: Deploy

# Every push to master deploys to production (agstatus.online) — a mini PC
# reached through a Cloudflare Tunnel, so there is no inbound SSH. Instead a
# self-hosted GitHub Actions runner on the machine itself (labels:
# self-hosted + agstatus) executes the deploy locally: the runner keeps a
# checkout at /apps/agstatus and rebuilds via docker compose.
#
# Runner setup (one-time, on the mini PC): repo Settings → Actions →
# Runners → New self-hosted runner, add the extra label "agstatus", then
# install it as a service so it survives reboots (./svc.sh install && start).

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /apps/agstatus

jobs:
  deploy:
    name: Deploy to agstatus.online
    runs-on: [self-hosted, agstatus]
    timeout-minutes: 20
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          # The runner's ~/.docker/config.json names a credsStore of
          # "desktop.exe" — a Docker Desktop credential helper that does not
          # exist on this machine — so every build died before pulling anything:
          #   load metadata for docker.io/library/node:20-alpine
          #   ERROR: error getting credentials — exec:
          #   "docker-credential-desktop.exe": executable file not found in $PATH
          # Nothing this stack pulls is private (node, postgres, caddy and
          # cloudflared are all public Docker Hub images; the app image is built
          # right here), so the deploy does not need credentials at all. Build
          # with a throwaway config that declares no helper, rather than
          # depending on the machine's config being repaired — this way a
          # reimaged runner cannot reintroduce the same failure.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}' > "$DOCKER_CONFIG/config.json"
          cd "$DEPLOY_PATH"
          git fetch origin master
          git reset --hard origin/master
          # docker compose --profile tunnel up -d --build --remove-orphans.
          # If the network is not on the subnet docker-compose.yml pins, the
          # script recreates it first, by down and then up. A bare up would
          # rebuild the network in place and leave the containers unable to
          # find each other. The script's header explains why.
          bash scripts/deploy-compose-up.sh
          docker image prune -f > /dev/null

      - name: Verify
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://localhost:3000/healthz" > /dev/null 2>&1 \
               && curl -fsS --max-time 5 "https://agstatus.online/healthz" > /dev/null 2>&1; then
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy." >&2
          exit 1
