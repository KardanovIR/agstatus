name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server (build + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agstatus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agstatus_test

  cli:
    name: CLI (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      # The CLI e2e suite imports the server sources and spawns dist/server.js.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: cli
      - run: npx tsc --noEmit
        working-directory: cli
      # Every failure this job has produced was a spawned process that did not
      # become ready inside the default 10s hook timeout — never a wrong answer.
      # The same suite that fails under contention passes in seconds when the
      # startup cost is not paid by twelve workers at once, so give startup room
      # instead of chasing the flake.
      - run: npx vitest run --testTimeout 30000 --hookTimeout 30000
        working-directory: cli

  hooks:
    name: Hook script (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck hooks/claude-status-hook.sh deploy/bootstrap-droplet.sh scripts/*.sh

  # public/install.sh and public/install.ps1 are the only documented way to
  # install AgStatus, and they are served straight off the board at
  # agstatus.online/install.sh and /install.ps1. Nobody reviews them in a shell
  # before `| sh` or `| iex` runs them, and a syntax error there is a broken
  # install for everyone until the next deploy — so they get parsed on every
  # push. The steps require both files to exist; that is deliberate, so a
  # renamed or deleted installer shows up as a red build rather than as a check
  # that silently stopped checking anything.
  installers:
    name: Installers (shell syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh parses as POSIX sh
        run: |
          set -eu
          test -f public/install.sh || { echo "::error::public/install.sh is missing"; exit 1; }
          # The script is piped into `sh`, so it must be POSIX sh and not bash.
          # On the runner /bin/sh IS dash, which makes these first two the same
          # parser today; dash is named explicitly so the check keeps its
          # meaning if the image's /bin/sh ever changes.
          sh -n public/install.sh
          if command -v dash > /dev/null 2>&1; then dash -n public/install.sh; fi
          # macOS ships bash 3.2 as /bin/sh, so that is the other interpreter
          # `curl … | sh` actually lands on in the wild.
          bash -n public/install.sh
          echo "public/install.sh parses under sh, dash and bash"
      - name: install.ps1 parses
        shell: pwsh
        run: |
          if (-not (Test-Path 'public/install.ps1')) {
            Write-Host '::error::public/install.ps1 is missing'
            exit 1
          }
          # PowerShell 7.x is preinstalled on the ubuntu runner image, so this
          # is free. It catches gross syntax errors early, but it CANNOT catch
          # the 5.1 incompatibilities the installer is written to avoid (??, ?:,
          # && and || all parse happily under 7) — the windows-powershell job
          # below is the one that enforces those.
          $path = (Resolve-Path 'public/install.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "public/install.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"

  # Windows PowerShell 5.1 is what `irm … | iex` hits on a stock Windows box —
  # it is the version in the OS, and it is strictly older than the pwsh 7 on the
  # Linux runners. Only 5.1 itself will reject the 7-only syntax (??, ?:, &&,
  # ||) that would otherwise ship and fail on every un-upgraded machine.
  # `shell: powershell` is GitHub's mapping for powershell.exe, i.e. Desktop 5.1.
  windows-powershell:
    name: install.ps1 (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 parses under 5.1
        shell: powershell
        run: |
          if (-not (Test-Path 'public/install.ps1')) {
            Write-Host '::error::public/install.ps1 is missing'
            exit 1
          }
          $path = (Resolve-Path 'public/install.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "public/install.ps1 parses under Windows PowerShell $($PSVersionTable.PSVersion)"
      # The version lookup, run for real under 5.1, the floor. Every install
      # broke when the repo was renamed: the old name's /releases/latest
      # answered with a 301 to the new one's, and the lookup read that as its
      # answer. Only the file's top-level function definitions are loaded;
      # Invoke-AgStatusInstall is defined and never called, so nothing is
      # downloaded or installed. The old name keeps proving the rename hop for
      # as long as GitHub keeps redirecting it, i.e. until a new repo takes it.
      - name: install.ps1 resolves the latest release, through a rename too
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-AgStatusInstall raises this before its lookup; so must we.
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'public/install.ps1').Path, [ref]$tokens, [ref]$errors)
          $defs = @($ast.EndBlock.Statements | Where-Object { $_ -is [System.Management.Automation.Language.FunctionDefinitionAst] })
          foreach ($def in $defs) { . ([scriptblock]::Create($def.Extent.Text)) }
          foreach ($name in @('KardanovIR/agstatus', 'KardanovIR/claude-status-dashboard')) {
            $v = Get-AgStatusLatestVersion -LatestUrl "https://github.com/$name/releases/latest"
            if ($v -notmatch '^\d+\.\d+\.\d+$') {
              Write-Host "::error::$name/releases/latest resolved to '$v'"
              exit 1
            }
            Write-Host "$name/releases/latest -> $v"
          }
          # Which redirects count as a rename: github.com, https, owner/name.
          if (-not (Test-AgStatusLatestUrl -Url 'https://github.com/KardanovIR/agstatus/releases/latest')) {
            Write-Host '::error::a renamed repo''s /releases/latest is not followed'
            exit 1
          }
          foreach ($url in @(
            'http://github.com/a/b/releases/latest',
            'https://github.com.evil.example/a/b/releases/latest',
            'https://evil.example/a/b/releases/latest',
            'https://GITHUB.COM/a/b/releases/latest',
            'https://github.com/a/b/c/releases/latest',
            'https://github.com/../b/releases/latest',
            'https://github.com/a/b/releases/latest?x=1',
            'https://github.com/a/b/releases/tag/v1.6.1'
          )) {
            if (Test-AgStatusLatestUrl -Url $url) {
              Write-Host "::error::the version lookup would follow $url"
              exit 1
            }
          }
          Write-Host 'the version lookup follows a rename and nothing else'

  # The two jobs above prove install.ps1 PARSES, and the second that its version
  # lookup answers. Nothing had ever RUN the installer itself — the
  # only documented Windows install path had never been executed end to end, so
  # it could have been broken for a whole release and nothing would have said
  # so. These two execute it.
  #
  # This one runs the refusals, which are the only part that can run anywhere:
  # every one of them throws before the first network call and the first write.
  installer-guards:
    name: install.ps1 (argument guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The guards refuse what they are supposed to refuse
        shell: pwsh
        run: |
          $text = Get-Content -Raw 'public/install.ps1'
          function Assert-Refusal([string[]] $Arguments, [string] $Expected) {
            $threw = $false
            try { & ([scriptblock]::Create($text)) @Arguments } catch {
              $threw = $true
              if ($_.Exception.Message -notlike "*$Expected*") {
                Write-Host "::error::install.ps1 $Arguments refused with the wrong message: $($_.Exception.Message)"
                exit 1
              }
            }
            if (-not $threw) {
              Write-Host "::error::install.ps1 $Arguments was accepted; it must be refused"
              exit 1
            }
            Write-Host "refused as expected: $Arguments"
          }
          # The script-block form is the one the file's own header documents,
          # and the only one that can carry parameters through `irm`.
          #
          # A POSIX spelling binds POSITIONALLY to -Code here, so without the
          # guard `--code ABCD-1234` would be silently taken as a board code of
          # "--code" and a stray argument.
          Assert-Refusal @('--code','ABCD-1234') 'That looks like a POSIX-style flag'
          # param() is a simple block, so anything unbindable lands in $args
          # instead of erroring. The guard is what turns that into a refusal.
          #
          # These two also pin WHICH refusal. A misspelled PowerShell parameter
          # binds positionally exactly as `--code` does, so it used to come back
          # with the POSIX message — advice about `--code` vs -Code for someone
          # who never typed a POSIX flag. It gets the list of real parameters.
          Assert-Refusal @('-Bogus','x') 'Unrecognised argument(s)'
          Assert-Refusal @('-Cde','ABCD-1234') 'Unrecognised argument(s)'
          # And on a non-Windows host it must say so rather than start work.
          Assert-Refusal @() 'install.ps1 is the Windows installer'

  # The real thing: the documented one-liner, executed on Windows, against a
  # real board built from this checkout.
  #
  # It installs the LATEST PUBLISHED RELEASE, not this PR's code — `$repo` in
  # install.ps1 is hard-coded and has no override — so what this proves is that
  # the install path works right now, which is exactly the thing that was never
  # being checked. It does not prove this PR's artifact layout installs.
  #
  # It runs as a created standard user because step 1 of the installer refuses
  # an elevated shell, and GitHub's Windows image runs jobs elevated. That
  # refusal is itself asserted below, so if the image ever stops being elevated
  # this job says so instead of quietly testing something else.
  windows-install:
    name: install.ps1 (real install, Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: The elevation refusal, asserted where it applies
        shell: powershell
        run: |
          $principal = New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Host '::error::this runner is no longer elevated - the refusal below cannot be asserted, and the install can run directly instead of through a created user'
            exit 1
          }
          $text = Get-Content -Raw 'public/install.ps1'
          $threw = $false
          try { & ([scriptblock]::Create($text)) } catch {
            $threw = $true
            if ($_.Exception.Message -notlike '*non-elevated PowerShell window*') {
              Write-Host "::error::elevated run refused with the wrong message: $($_.Exception.Message)"
              exit 1
            }
          }
          if (-not $threw) { Write-Host '::error::an elevated run was accepted'; exit 1 }
          # Step 1 precedes every write, so nothing can have landed yet.
          if (Test-Path "$env:LOCALAPPDATA\AgStatus") {
            Write-Host '::error::the refused run still wrote to %LOCALAPPDATA%'
            exit 1
          }
          Write-Host 'elevated run refused, nothing written'

      - name: Blast shield
        shell: powershell
        run: |
          # resolveBaseUrl falls back to AGSTATUS_URL and then to the PRODUCTION
          # board, so any run that loses its -Url must die on a dead local port
          # rather than mint a real board on agstatus.online.
          [Environment]::SetEnvironmentVariable('AGSTATUS_URL','http://127.0.0.1:1','Machine')

      - name: A real board to install against
        shell: powershell
        run: |
          $port = 4399
          # PUBLIC_URL is deliberately wrong, exactly as cli/test/e2e.test.ts
          # has it: the CLI must build board URLs from the origin it reached.
          $env:MULTI_TENANT = 'true'; $env:PORT = "$port"
          $env:PUBLIC_URL = 'http://misconfigured.example'; $env:SESSION_TTL_MS = '0'
          Start-Process node -ArgumentList 'dist/server.js' -PassThru |
            Select-Object -ExpandProperty Id |
            Set-Content "$env:RUNNER_TEMP\board.pid"
          $base = "http://127.0.0.1:$port"
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-RestMethod "$base/healthz" -TimeoutSec 2 | Out-Null; $up = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { Write-Host '::error::the board never came up'; exit 1 }
          "AGSTATUS_TEST_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: A non-elevated user to install as
        shell: powershell
        run: |
          $pw = [Guid]::NewGuid().ToString('N') + '!Aa1'   # throwaway, never echoed
          "AGSTATUS_CI_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          net user agstatusci $pw /add /y | Out-Null       # NOT in Administrators
          $stage = 'C:\agstatus-ci'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'public/install.ps1' "$stage\install.ps1"
          icacls $stage /grant 'agstatusci:(OI)(CI)(M)' /T | Out-Null
          # The wrapper is scaffolding for the invocation only: install.ps1 is
          # loaded verbatim and called through its own documented form.
          @'
          param([string] $Base)
          try {
            & ([scriptblock]::Create((Get-Content -Raw 'C:\agstatus-ci\install.ps1'))) -Url $Base
            exit 0
          } catch { Write-Host "INSTALLER THREW: $($_.Exception.Message)"; exit 1 }
          '@ | Set-Content "$stage\run.ps1" -Encoding ascii
          $cred = New-Object System.Management.Automation.PSCredential('.\agstatusci',
            (ConvertTo-SecureString $pw -AsPlainText -Force))
          # Warm the profile so C:\Users\agstatusci exists before the
          # installer reads %LOCALAPPDATA%.
          Start-Process powershell.exe -ArgumentList '-NoProfile','-Command','whoami' `
            -Credential $cred -WorkingDirectory $stage -Wait

      - name: Install, then upgrade over it
        shell: powershell
        run: |
          $cred = New-Object System.Management.Automation.PSCredential('.\agstatusci',
            (ConvertTo-SecureString $env:AGSTATUS_CI_PW -AsPlainText -Force))
          function Invoke-Install([string] $Label) {
            $out = "$env:RUNNER_TEMP\$Label.out"; $err = "$env:RUNNER_TEMP\$Label.err"
            $p = Start-Process powershell.exe -ArgumentList `
              '-NoProfile','-ExecutionPolicy','Bypass','-File','C:\agstatus-ci\run.ps1', `
              '-Base',$env:AGSTATUS_TEST_BASE `
              -Credential $cred -WorkingDirectory 'C:\agstatus-ci' `
              -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
            Get-Content $out -ErrorAction SilentlyContinue | Write-Host
            if ($p.ExitCode -ne 0) {
              Get-Content $err -ErrorAction SilentlyContinue | Write-Host
              Write-Host "::error::$Label exited $($p.ExitCode)"
              exit 1
            }
          }
          # The same command is a first install and an upgrade — the README and
          # docs/hooks.md both promise that, and nothing checked it.
          Invoke-Install 'install'
          Invoke-Install 'upgrade'

      - name: What landed, and does it run
        shell: powershell
        run: |
          $prefix = 'C:\Users\agstatusci\AppData\Local\AgStatus'
          foreach ($rel in @('lib\agstatus\dist\cli.js','lib\agstatus\package.json','lib\agstatus\assets\agstatus-hook.js')) {
            if (-not (Test-Path "$prefix\$rel")) {
              Write-Host "::error::missing after install: $rel"
              exit 1
            }
          }
          # End to end: the installed build runs and can say what it is. This
          # is the published release, so it is deliberately NOT compared
          # against this checkout's cli/package.json.
          $v = & node "$prefix\lib\agstatus\dist\cli.js" version
          if ($v -notmatch '^agstatus \d+\.\d+\.\d+') {
            Write-Host "::error::the installed build did not report a version: $v"
            exit 1
          }
          Write-Host "installed and runnable: $v"

      - name: Clean up
        if: always()
        shell: powershell
        run: |
          # Not $pid: that is a read-only automatic variable, and assigning to
          # it fails the step after the assertions have already passed.
          $boardPid = Get-Content "$env:RUNNER_TEMP\board.pid" -ErrorAction SilentlyContinue
          if ($boardPid) { Stop-Process -Id $boardPid -Force -ErrorAction SilentlyContinue }
          net user agstatusci /delete 2>$null | Out-Null
          Remove-Item 'C:\Users\agstatusci' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\agstatus-ci' -Recurse -Force -ErrorAction SilentlyContinue

  # Android has never been compiled by CI, which is why docs/release-notes
  # /v1.5.0.md could say "Android still has the old palette" for a whole
  # release cycle without anything objecting: there was no build to go red.
  # The machine this is usually developed on has JDK 11 and 8, and AGP needs
  # 17, so for a long time this runner was the only place it COULD be built.
  #
  # assembleDebug, not assembleRelease: signing is conditional on a
  # keystore.properties that is gitignored and must never reach CI, and
  # compiling every source file is the whole point here.
  android:
    name: Android (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: lint
        working-directory: android
        # Separate from the build so a lint regression is distinguishable from
        # a compile error in the log.
        run: ./gradlew --no-daemon lintDebug
      - name: keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: agstatus-debug-apk
          # The only machine that can build this is the one with JDK 17, which
          # is this runner: AGP 8.13 refuses anything older and the development
          # Mac has 11 and 8. Keeping the APK is what makes the Android client
          # reviewable at all — download it, install it on an emulator, look at
          # it. Fourteen days is longer than any review takes.
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: unit tests
        working-directory: android
        # app/src/test has had five suites since the client was written and
        # nothing ever ran them: this job built the APK and stopped.
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: test report
        if: failure()
        working-directory: android
        run: |
          for f in app/build/reports/tests/testDebugUnitTest/classes/*.html; do
            [ -e "$f" ] || continue
            echo "::group::$(basename "$f")"
            sed -e 's/<[^>]*>//g' "$f" | grep -v '^[[:space:]]*$'
            echo '::endgroup::'
          done

  # Both platforms release.yml publishes, built the way it builds them. This
  # job used to build amd64 alone, so the arm64 image was first built at the
  # tag, by the job that publishes it; a multi-arch break now goes red here.
  # No QEMU step, as in the release: the arm64 image is FROM and COPY only, so
  # it needs no emulator. That alone would not catch a RUN added to its stage,
  # because BuildKit ships its own QEMU and would quietly emulate it, so the
  # first step refuses one. Nothing is pushed or loaded; the result stays in
  # the builder's cache.
  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Every RUN is on the build platform
        run: sh scripts/check-dockerfile-platforms.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  # The Focus listener is macOS-only (cli/src/listener/install.ts refuses any
  # other platform), and a handful of its tests assert behaviour that depends on
  # the host's real directory layout — they skip on the Linux job above, so this
  # is the only place they run. Without it, `install`, `doctor` and the resume
  # launcher would have no coverage at all on the platform they actually ship to.
  cli-macos:
    name: CLI (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      # Same reason as the Linux cli job above: the e2e suite imports the server
      # sources and spawns dist/server.js, so the root install and build have to
      # happen here too. Without them the suite dies on `Failed to load url
      # express` before running a single test — which is how this job stayed red
      # for a week while reporting a test failure rather than a setup one.
      - run: npm ci
      - run: npm run build
      - name: Install and test
        working-directory: cli
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run --testTimeout 30000 --hookTimeout 30000

  ios:
    name: iOS app (build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: >
          xcodebuild
          -project ios/AgStatus.xcodeproj
          -scheme AgStatus
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
