<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <!-- --ink-950, converted once. A meta cannot read a custom property. -->
  <meta name="theme-color" content="#0c0f0d" />
  <!-- The favicon the landing, docs and privacy pages carry, written from the
       icon artwork: this is the tab people keep open all day. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141815'/><circle cx='16' cy='16' r='6' fill='%2369c88e'/></svg>" />
  <title>AgStatus</title>
  <!-- Order is load-bearing: tokens, then the card (shared with the landing
       page, so the two can never drift), then the board around it, then the
       shell around the grid.
       Every file here names its release, "?v=", which the server ignores. A
       page a browser keeps, as Back takes it from the cache after a deploy,
       then finds its own release's files in the cache, not the next
       release's, which it may not fit. Raise it with every release, to the
       version the manifests carry: a test fails while it is behind
       package.json's. -->
  <link rel="stylesheet" href="/tokens.css?v=1.7.0" />
  <link rel="stylesheet" href="/card.css?v=1.7.0" />
  <link rel="stylesheet" href="/board.css?v=1.7.0" />
  <link rel="stylesheet" href="/shell.css?v=1.7.0" />
</head>
<body>
  <header class="topbar">
    <!-- The board's h1. It was a plain span, so the page shipped with no
         heading at all and a screen reader had nothing to navigate by. -->
    <h1 class="logo">AgStatus</h1>
    <!-- One bit of information, so it gets one dot — but a dot is colour
         alone, and an empty span has no accessible name at all. The word is
         in a live region beside it now, so the state is announced when it
         changes instead of living only in a `title` nothing reads. -->
    <span class="conn" id="conn" role="status">
      <span class="conn-dot" aria-hidden="true"></span>
      <span class="sr-only" id="conn-text">Connecting…</span>
    </span>
    <span class="topbar-spacer"></span>
  </header>

  <section class="usage" id="usage" aria-label="Plan usage limits" hidden></section>
  <div class="stats" id="stats" hidden></div>
  <!-- One surface for both detail routes, the usage history and a session's
       screen, so it is named for neither. -->
  <section class="detail" id="detail" aria-label="Detail" hidden></section>

  <!-- The board's one alarm: present only while a session is blocked, fixed
       to the bottom edge (shell.css), and one button that brings the card it
       names. Before the grid in reading order, so a keyboard reaches it ahead
       of the cards it leads to. Its face draws it, ground, edge and words, so
       that when another session blocks the face alone comes in from the
       bottom edge again, and the button stays where it is under the pointer.
       The region beside it says a new block aloud; it is in the page from the
       start, as a live region has to be. -->
  <button class="needs" id="needs" type="button" aria-describedby="needs-hint" hidden><span class="needs-face" id="needs-face"></span></button>
  <span id="needs-hint" hidden>Shows that session</span>
  <div class="sr-only" id="needs-said" aria-live="polite"></div>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="footer" id="footer">
    <span class="label">Webhook</span>
    <code id="webhook-url">—</code>
    <button class="copy" id="copy-btn" type="button" aria-label="Copy webhook URL">Copy</button>
    <span class="auth" id="auth-note"></span>
  </footer>

  <!-- The marks first: app.js reads them at definition time, and the landing
       page loads the same file so the two can never draw different icons. -->
  <script src="/marks.js?v=1.7.0"></script>
  <script src="/app.js?v=1.7.0"></script>
</body>
</html>
