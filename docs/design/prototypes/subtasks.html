        scroll: `<div class="groups">${AGENTS.map((src) => {
          const list = by(src);
          return `<div class="stack"><h2 class="group-label">${MARKS[src]}${agentName(src)}`
            + `<span class="count">${plural(list.length, 'session')}</span></h2>${list.map(cardHTML).join('')}</div>`;
        }).join('')}</div>`,
      };
    }
    return {
      pinned: `<div class="heads is-cols" style="--n:2">${heads}</div>`,
      scroll: `<div class="columns is-cols" style="--n:2">${AGENTS.map((src) =>
        `<div class="stack">${by(src).map(cardHTML).join('')}</div>`).join('')}</div>`,
    };
  }

  // ---- The web board (origin/master) -----------------------------------------

  function webCardHTML(s) {
    const v = view(s);
    const facts = [];
    if (s.host) facts.push(`<span>${esc(s.host)}</span>`);
    if (s.project && s.project !== s.name) facts.push(`<span>in ${esc(s.project)}</span>`);
    facts.push(`<span class="ts">${esc(s.age)}</span>`);
    if (s.tokens) facts.push(`<span class="tok">${esc(s.tokens)} tokens</span>`);
    const chip = `<span class="w-source">${MARKS[s.source].replace('class="mark"', '')}${esc(s.source)}</span>`;
    return `<article class="w-card status-${v.status}" data-card="${s.id}" data-status="${v.status}">
      <div class="w-head">
        <div class="w-title-row"><span class="w-name-open" data-open-card="${s.id}"><span class="w-name">${esc(s.name)}</span><span class="w-more" aria-hidden="true">›</span></span></div>
        <div class="w-state-row">${STATE_MARK[v.status]}<span class="w-badge">${v.status}</span></div>
      </div>
      ${v.message ? `<p class="w-message">${esc(v.message)}</p>` : ''}
      ${v.show ? subsHTML(s, v) : ''}
      <div class="w-meta">${chip}${facts.map((f) => `<span aria-hidden="true">·</span>${f}`).join('')}</div>
      ${s.host ? `<div class="w-actions"><span class="w-act">${FOCUS}Focus</span></div>` : ''}
    </article>`;
  }

  function webBoardHTML() {
    const usage = AGENTS.map((src) => `<section class="w-usage-block">
        <h2 class="w-usage-src">${agentName(src)}<span aria-hidden="true">›</span></h2>
        ${LIMITS[src].map((w) => {
          const level = w.pct >= 85 ? 'high' : w.pct >= 60 ? 'mid' : 'low';
          return `<div class="w-meter"><div class="w-meter-head"><span>${esc(w.label)}</span>`
            + `<span class="w-meter-value">${w.pct}% <span>· ${esc(w.reset)}</span></span></div>`
            + `<div class="w-track"><div class="w-fill ${level}" style="transform:scaleX(${w.pct / 100})"></div></div></div>`;
        }).join('')}
      </section>`).join('');
    const counts = {};
    sessions.forEach((s) => { const st = view(s).status; counts[st] = (counts[st] || 0) + 1; });
    // "working" is worked out on the client, as the badge is, and has a slot
    // only while a card wears it, so the strip always sums to the board.
    const stats = ['idle', 'planning', 'coding', 'testing', 'working', 'blocked', 'done']
      .filter((st) => st !== 'working' || counts.working).map((st) =>
      `<span class="w-stat${counts[st] ? '' : ' zero'}"><i class="st-c-${st}"></i><b>${counts[st] || 0}</b>${st}</span>`).join('');
    return `<div class="wb">
      <header class="w-top"><h1 class="w-logo">AgStatus</h1><span class="w-conn" title="Live"></span></header>
      <div class="w-usage">${usage}</div>
      <div class="w-stats">${stats}</div>
      <div class="w-grid">${[...sessions].sort(byRecent).map(webCardHTML).join('')}</div>
    </div>`;
  }

  // ---- The session screen -----------------------------------------------------

  function screenInnerHTML(s, v) {
    // Each class counted apart: a blocked subagent is not running, it is
    // waiting on you.
    const n = (test) => v.subs.filter(test).length;
    const count = [
      [n((x) => WORKING.has(x.status)), 'running'],
      [n((x) => x.status === 'blocked'), 'blocked'],
      [n((x) => x.status === 'failed'), 'failed'],
    ].filter(([k]) => k).map(([k, w]) => `${k} ${w}`).join(' · ');
    const doneLine = v.done
      ? `<p class="ss-done"><span class="n" data-count="${s.id}:ssdone">${v.done}</span> done ${state.done === 'batch' ? 'in this batch' : 'this turn'}</p>`
      : '';
    // The card's slot rule, here too: whoever needs you comes first, so the
    // phone's footer lands on it. The rest keep their start order.
    const list = [...v.subs.filter((x) => x.status === 'blocked'), ...v.subs.filter((x) => x.status !== 'blocked')];
    const subs = v.show
      ? `<section class="ss-section" data-box="ss"><h2 class="ss-label">Subtasks<span class="ss-count">${count}</span></h2>`
        + `<div class="ss-list">${list.map((x, i) => subRowHTML(s.id, x, i, { roomy: true })).join('')}</div>${doneLine}</section>`
      : '';
    const events = [[v.status, v.message, '14:06', 'just now'], ...TIMELINE];
    const tl = events.map(([st, msg, at, ago]) => `<div class="hrow">
        <div class="hgut" aria-hidden="true"><i class="hdot st-c-${st}"></i></div>
        <div class="hbody"><div class="hhead"><span class="hstatus st-c-${st}">${st}</span>
          <span class="hat">${at}</span><span class="hago">${ago}</span></div>
          <div class="hmsg">${esc(msg)}</div></div></div>`).join('');
    return { subs, tl };
  }

  function screenHTML(d) {
    const s = sessions.find((x) => x.id === screen.id);
    const v = view(s);
    const { subs, tl } = screenInnerHTML(s, v);
    if (d.web) {
      return `<div class="wb"><div class="w-detail">
        <div class="dv-head"><button class="dv-back" type="button" data-back>‹ Board</button><h2 class="dv-title">${esc(s.name)}</h2></div>
        ${subs}
        <section class="ss-section"><h2 class="ss-label">Timeline</h2>${tl}</section>
      </div></div>`;
    }
    return `<div class="navbar is-push">
        <button class="capsule" type="button" data-back aria-label="Back">${BACK}</button>
        <span class="nav-title is-plain">${esc(s.name)}</span><span></span>
      </div>
      <div class="ss">
        <div class="ss-head">${s.project ? `<span class="ss-proj">${esc(s.project)}</span>` : ''}
          <span class="ss-status st-c-${v.status}">${v.status}</span></div>
        ${subs}
        <section class="ss-section"><h2 class="ss-label">Timeline</h2>${tl}</section>
      </div>`;
  }

  // ---- The device ------------------------------------------------------------

  function deviceHTML() {
    const d = DEVICES[state.device];
    if (d.web) return screen ? screenHTML(d) : webBoardHTML();
    const bar = `<div class="statusbar"><span>${d.phone ? '9:41' : '9:41 AM&ensp;Wed 28 Oct'}</span>${BATTERY}</div>`;
    if (screen) return bar + screenHTML(d);
    const { pinned, scroll } = iosBoardHTML(d);
    return `${bar}
      <div class="navbar">
        <span class="capsule"><i class="conn" title="Live"></i></span>
        <span class="nav-title">AgStatus</span>
        <span class="capsule is-trailing">${LAPTOP}${GEAR}</span>
      </div>
      <div class="pinned">${pinned}</div>
      <div class="board-scroll"><div class="board">${scroll}</div></div>
      <div class="streak">${STAR}<div>
        <div class="streak-line"><span class="streak-name">Silver</span>
          <span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>
          <span>19 days active</span><span class="streak-next">11d to Gold</span></div>
        <div class="streak-track"><i></i></div>
      </div></div>`;
  }

  // ---- Fit passes (the ViewThatFits cascades in SessionCardView) -------------

  function fitCards(root) {
    root.querySelectorAll('.card').forEach((card) => {
      const name = card.querySelector('.name');
      card.classList.toggle('is-two-line', name.scrollHeight > 30);
    });
    // Nothing on the meta line is ever cut. Under a title the machine goes
    // first; under a folder name, the directory.
    root.querySelectorAll('.meta').forEach((meta) => {
      const order = meta.dataset.titled === 'true' ? ['host', 'project'] : ['project', 'host'];
      for (const fact of order) {
        if (meta.scrollWidth <= meta.clientWidth) return;
        const el = meta.querySelector(`[data-fact="${fact}"]`);
        if (!el) continue;
        (el.previousElementSibling?.classList.contains('sep') ? el.previousElementSibling : el.nextElementSibling)?.remove();
        el.remove();
      }
    });
  }

  // ---- Paint ---------------------------------------------------------------
  // Every change redraws the device. What moves is worked out by comparing the
  // drawing before with the drawing after: a row that is gone fades out first
  // (and, if no row takes its slot, folds its own height, so the rows under it
  // close up as part of its going), a row that is new fades in where it
  // stands, a card that changed place travels there, a count that changed
  // ticks, and a card whose word changed lifts its edge once — the board's
  // existing state-change. A row that did not start, finish or change state
  // never travels; only opening or folding the list, the reader's own act,
  // may carry one.

  const deviceEl = document.getElementById('device');
  const fitEl = document.getElementById('fit');
  const captionEl = document.getElementById('caption');
  const ruleEl = document.getElementById('rule');
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => { setTimeout(r, ms); });
  const scaleK = () => { const r = deviceEl.getBoundingClientRect(); return r.width / deviceEl.offsetWidth || 1; };
  const boxOf = (el) => el.closest('[data-card], [data-box]');

  function snapshot() {
    const m = { cards: new Map(), rows: new Map(), counts: new Map(), cardStatus: new Map(), rowStatus: new Map() };
    deviceEl.querySelectorAll('[data-card]').forEach((el) => {
      m.cards.set(el.dataset.card, el.getBoundingClientRect());
      m.cardStatus.set(el.dataset.card, el.dataset.status);
    });
    deviceEl.querySelectorAll('[data-row]').forEach((el) => {
      const r = el.getBoundingClientRect();
      const b = boxOf(el)?.getBoundingClientRect() || r;
      m.rows.set(el.dataset.row, { x: r.left - b.left, y: r.top - b.top });
      m.rowStatus.set(el.dataset.row, el.dataset.status);
    });
    deviceEl.querySelectorAll('[data-count]').forEach((el) => m.counts.set(el.dataset.count, el.textContent));
    return m;
  }

  let chain = Promise.resolve();
  /** Redraw. `animate` is for news (Play, expand); a new scenario is drawn still. */
  const paint = (opts = {}) => { chain = chain.then(() => paintNow(opts)).catch((e) => console.error(e)); return chain; };

  async function paintNow({ animate = false, revealFocus = false, expand = false } = {}) {
    const d = DEVICES[state.device];
    const moving = animate && !reduced();
    const scroller = deviceEl.querySelector('.board-scroll, .ss, .wb');
    const scrollTop = scroller ? scroller.scrollTop : 0;
    const tpl = document.createElement('template');
    tpl.innerHTML = deviceHTML();
    const before = snapshot();

    if (moving) {
      const keep = new Set([...tpl.content.querySelectorAll('[data-row]')].map((el) => el.dataset.row));
      const leaving = [...deviceEl.querySelectorAll('[data-row]')].filter((el) => !keep.has(el.dataset.row));
      if (leaving.length) {
        leaving.forEach((el) => el.classList.add('leaving'));
        await wait(220);
        // A slot a new row takes is a crossfade: the new one fades in where
        // the old one stood. A slot nothing new takes closes.
        const closing = leaving.filter((el) => {
          const box = boxOf(el);
          const sel = box.dataset.card ? `[data-card="${box.dataset.card}"]` : `[data-box="${box.dataset.box}"]`;
          const heir = tpl.content.querySelector(`${sel} [data-row][data-slot="${el.dataset.slot}"]`);
          return !heir || before.rows.has(heir.dataset.row);
        });
        await Promise.all(closing.map((el) => el.animate(
          [{ height: `${el.offsetHeight}px`, minHeight: '0px' }, { height: '0px', minHeight: '0px' }],
          { duration: 200, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }).finished));
        // The cards under a closed slot have already travelled with it; they
        // are measured again, so they are not sent back to travel twice.
        deviceEl.querySelectorAll('[data-card]').forEach((el) => before.cards.set(el.dataset.card, el.getBoundingClientRect()));
      }
    }

    deviceEl.className = `device${d.phone ? ' is-phone' : ''}${d.web ? ' is-web' : ''}`;
    deviceEl.style.setProperty('--w', `${d.w}px`);
    deviceEl.style.setProperty('--h', `${d.h}px`);
    deviceEl.style.setProperty('--corner', `${d.corner}px`);
    deviceEl.replaceChildren(tpl.content);
    fitCards(deviceEl);
    scale();

    const list = deviceEl.querySelector('.board-scroll, .ss, .wb');
    if (list) list.scrollTop = animate ? scrollTop : 0;
    if (revealFocus && list && !screen) reveal(list);

    const k = scaleK();
    deviceEl.querySelectorAll('[data-card]').forEach((el) => {
      const id = el.dataset.card;
      const was = before.cards.get(id);
      if (animate && before.cardStatus.has(id) && before.cardStatus.get(id) !== el.dataset.status) el.classList.add('changed');
      if (!moving || !was) return;
      const now = el.getBoundingClientRect();
      const dx = (was.left - now.left) / k;
      const dy = (was.top - now.top) / k;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
        { duration: 420, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
    });
    deviceEl.querySelectorAll('[data-row]').forEach((el) => {
      const key = el.dataset.row;
      const was = before.rows.get(key);
      if (!animate) return;
      if (!was) { if (moving) el.classList.add('entering'); return; }
      if (before.rowStatus.get(key) !== el.dataset.status) el.classList.add('changed');
      if (!moving || !expand) return;
      const r = el.getBoundingClientRect();
      const b = boxOf(el)?.getBoundingClientRect() || r;
      const dy = (was.y - (r.top - b.top)) / k;
      if (Math.abs(dy) < 1) return;
      el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }],
        { duration: 320, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
    });
    if (moving) {
      deviceEl.querySelectorAll('[data-count]').forEach((el) => {
        const was = before.counts.get(el.dataset.count);
        if (was !== undefined && was !== el.textContent) el.classList.add('ticked');
      });
    }

    ruleEl.innerHTML = ruleHTML().map((t) => `<p>${t}</p>`).join('');
    document.querySelectorAll('.pv-seg').forEach((seg) => {
      seg.querySelectorAll('button').forEach((b) =>
        b.setAttribute('aria-pressed', String(b.dataset.v === state[seg.dataset.key])));
    });
    if (!BARE) {
      const q = new URLSearchParams(state);
      if (played) q.set('step', String(played));
      try { history.replaceState(null, '', `${location.pathname}?${q}`); } catch { /* a sandboxed frame */ }
    }
  }

  /** Bring the card being judged into the list, clear of a stuck group name. */
  function reveal(list) {
    const card = deviceEl.querySelector(`[data-card="${focusId}"]`);
    if (!card) return;
    const lead = deviceEl.querySelector('.group-label') ? 44 : 8;
    const k = scaleK();
    const top = (card.getBoundingClientRect().top - list.getBoundingClientRect().top) / k;
    const bottom = top + card.offsetHeight;
    if (bottom > list.clientHeight - 8 || top < 0) list.scrollTop += top - lead;
  }

  /** The row you arrived at stays lit for two seconds, then goes out: with a
   * fade, or at once with reduced motion (the transition is then 0.01ms). It
   * is not lit again by a later redraw. */
  let arrivalTimer = 0;
  function settleArrival() {
    clearTimeout(arrivalTimer);
    arrivalTimer = setTimeout(() => {
      deviceEl.querySelector('.sub.is-arrived')?.classList.add('is-settled');
      if (screen) screen.sub = null;
    }, 2000);
  }

  function scale() {
    const d = DEVICES[state.device];
    if (BARE) {
      deviceEl.style.transform = '';
      fitEl.style.width = fitEl.style.height = '';
      return;
    }
    const availW = fitEl.parentElement.clientWidth - 32;
    const availH = innerHeight - document.querySelector('.pv-bar').offsetHeight - 150;
    const k = Math.min(1, availW / d.w, Math.max(availH / d.h, 0.5));
    deviceEl.style.transform = k < 1 ? `scale(${k})` : '';
    fitEl.style.width = `${d.w * k}px`;
    fitEl.style.height = `${d.h * k}px`;
    const hint = screen
      ? 'Back returns to the board'
      : d.phone ? 'Click the footer for the session screen, a row for that subtask' : 'Click the footer to expand in place, a row for the session screen';
    captionEl.textContent = `${d.name} · ${d.w} × ${d.h} ${d.unit} · shown at ${Math.round(k * 100)}% · ${hint}`;
  }

  // ---- What it is, and what is open ------------------------------------------
  // Figures are read off the drawing, so they are true of the device on show.

  /** How much taller the subagents make the card being judged, measured. */
  function growth() {
    const card = deviceEl.querySelector(`[data-card="${focusId}"]`);
    if (!card || !card.querySelector('.subs')) return 0;
    const s = focusSession();
    const bare = document.createElement('div');
    const saved = { subs: s.subs, finished: s.finished };
    s.subs = []; s.finished = {};
    bare.innerHTML = DEVICES[state.device].web ? webCardHTML(s) : cardHTML(s);
    Object.assign(s, saved);
    const el = bare.firstElementChild;
    el.style.width = `${card.offsetWidth}px`;
    el.style.position = 'absolute';
    el.style.visibility = 'hidden';
    card.parentElement.append(el);
    fitCards(el.parentElement);
    const h = el.offsetHeight;
    el.remove();
    return card.offsetHeight - h;
  }

  function ruleHTML() {
    const d = DEVICES[state.device];
    const f = focusSession();
    const v = view(f);
    const p = [];
    const slots = d.slots;
    const where = d.phone ? 'on a phone' : d.web ? 'in a web column' : 'in an iPad column';
    const sc = state.scenario;

    if (state.app === 'older') {
      p.push('<b>An older app.</b> It ignores the subtask data, so the card has no rows. It is calmer than today all the same: the parent\'s line is its own, where today the subagents\' tool calls overwrite it (90% of what that line showed on the owner\'s Mac). A blocked subagent still turns it BLOCKED and still sends the push, because the server sets the parent\'s status. After the turn it shows the busiest subtask\'s state: an unknown status would fail to decode on a shipped iPhone.');
    } else if (screen) {
      p.push(`<b>The session screen.</b> On a phone the footer opens this screen; on any device a row does, scrolled to that subtask, which is lit for two seconds and then goes out. Every subtask still running is listed above the timeline${d.phone ? ', with room for its activity on a line of its own' : ', its state leading in a column of its own as the timeline\'s does'}. A blocked one comes first, so the footer lands on it, and the header counts running, blocked and failed apart. The finished ones are a count.`);
    } else {
      const LEAD = {
        none: '<b>No subagents.</b> The card is today\'s card, line for line. Nothing is set aside for subtasks: no empty hairline, no zero.',
        two: `<b>Two subagents from the Agent tool.</b> Each is a row under one hairline: what it was asked to do, what it is doing now, and its state. The state is the badge's mark in its colour, with its word beside it in the quiet ink, so the badge stays the one coloured word on the card${d.web ? '. On the web it leads the row, under the badge\'s own mark' : ''}. The parent's line is its own again.`,
        ten: `<b>A workflow, ten running.</b> ${slots === 2 ? 'Two rows fit on a phone' : 'Three rows fit in a column'}; the rest are counted in the footer with the finished ones. Labels are the workflow's own, so phase and target read in one word.`,
        thirty: `<b>A session at its peak.</b> Thirty run at once on the owner's Mac, across four workflows and the Agent tool, with ${sumDone(f)} finished this turn. The card is no taller than it is for ten: the count carries the size, not the card.`,
        blocked: '<b>One subagent needs approval.</b> The card turns BLOCKED: the same word, edge and alarm as any blocked session, and the same push. Its line says why, then which: "Needs approval: verify:hook", so a phone that cuts the line still keeps the reason. That row takes a visible slot though it started seventh, and it is the only row whose word is coloured. Once approved, it keeps that slot until it finishes.',
        failed: '<b>One failed.</b> It stays listed as "failed", with a crossed circle in a muted red derived from blocked\'s. It is there for the lean-in and is not an alarm: nobody is waiting on you, and the parent already has the error. It goes when the parent\'s turn ends.',
        finished: '<b>All finished, the turn still going.</b> The rows have folded into the count, which stays until the parent\'s turn ends and then goes with it.',
        background: '<b>The turn has ended, and two background subagents still work.</b> The card must not say DONE: done means your turn, and the parent will speak again when they report. Its line, from the server, says only "2 subagents still running", so it fits a phone and agrees with either word above it.',
        nested: '<b>Nested.</b> "Find every Focus call site" was started by implement:server, two levels down. It is listed flat, in start order like the rest. Only 5 of about 3,800 subagents on the owner\'s Mac were nested, too few to earn an indent.',
        minimal: '<b>Minimal mode.</b> A label comes from a prompt, which minimal mode never sends, so subagents are numbered in the order they started this turn, and a number stays with its subagent. Activity is the tool\'s name, as the card\'s own line already is.',
        codex: '<b>Codex.</b> Sub-agents go by their nicknames. On the owner\'s Mac Codex never ran more than three at once, so its footer is rare.',
        long: '<b>Long labels.</b> Agent-tool descriptions at their real lengths: 52 characters is the p90 on the owner\'s Mac, 23 the median. A label takes at most 58% of the row\'s text and is cut past that, so the activity, the live part of the row, always keeps a share of it.',
        expanded: '<b>Expanded in place.</b> On an iPad or the web the footer opens the whole list inside the card, and "Show less" folds it. The cards below move down once.',
      };
      p.push(LEAD[sc] || LEAD.ten);
      if (sc === 'expanded' && d.phone) {
        p.push('<b>Not on a phone.</b> There the footer opens the session screen instead, where every subagent has two lines. Choose "Session screen" to see it.');
      }
    }

    const g = growth();
    if (g > 0) p.push(`<b>Cost.</b> The subagents make this card ${g} ${d.unit} taller ${where}.${d.web ? ' Each card in the grid keeps its own height (align-items: start), so the cards beside it do not stretch; the next row of cards moves down.' : ''}`);

    // The open questions, where the state on show touches them.
    const hidden = v.show && !expanded.has(f.id) && v.subs.length > slots;
    if (hidden && state.app === 'next') {
      p.push(state.rows === 'oldest'
        ? '<b>Open: rows shown — oldest.</b> The rows that fit are the first to start, and each keeps its slot until it finishes. Then the next to start takes that slot in place, and no other row moves. It is stable: the eye comes back to the same place. Its cost is that a subagent busy lower in the list is only a number.'
        : '<b>Open: rows shown — most active.</b> The rows that fit are the most recently active. A hidden one that reports in takes the slot of the stalest row on show, in place. On the owner\'s Mac a session posts subagent events 36 times a minute at the median, so in a workflow a slot changes hands every few seconds. Press Play: the new subagent and the one that reports in each take a slot, in place.');
    }
    if (f.turnEnded && v.subs.some((x) => WORKING.has(x.status)) && state.app === 'next') {
      p.push(state.bgstatus === 'working'
        ? `<b>Open: card after its turn — "working" (proposed).</b> A word of its own and a branch mark (one stem forking into two arms, each ending in a node), in coding's colour: the parent has stopped, and its subagents have not. The mark and the word tell it from coding, as every state here is told. "Working" over "waiting", because on this board waiting reads as waiting on you (blocked and done are both your turn), and nobody is. It is worked out on the client, never sent as a status: see the note in this file's header.${d.web ? ' The stats strip gives it a slot while a card wears it, so the strip still sums to the board.' : ''}`
        : '<b>Open: card after its turn — busiest subtask.</b> The card wears its most urgent subagent\'s state (blocked, testing, coding, planning, in that order). It needs no new word. But it reads as if the parent were still at work, and it changes whenever that subagent does: more motion, for news about a row.');
    }
    if (v.show && v.done > 0 && state.app === 'next' && f.batch > 1) {
      p.push(state.done === 'session'
        ? `<b>Open: done count — whole turn.</b> "${sumDone(f)} done" counts every subagent finished this turn, so it only climbs, until the turn ends.`
        : `<b>Open: done count — this batch.</b> "${f.finished[f.batch] || 0} done" counts only the batch running now. It went back to 0 when this phase started, which tells you how far through the phase it is, at the price of a number that drops.`);
    }
    return p;
  }

  // ---- Play ------------------------------------------------------------------
  // A few seconds of a busy session: a subagent starts, one finishes and folds
  // into the count, a hidden one reports in (which only rows=active shows), and
  // one is blocked — or, if one already is, it is let go.

  function steps() {
    const f = focusSession();
    const start = () => {
      const pool = STARTS[f.kind] || STARTS.agent;
      const [label, status, activity] = pool[f.starts % pool.length];
      f.starts += 1;
      f.subs.push({ ...SUB(label, status, activity, 0), key: `k${nextKey++}` });
    };
    // Read when each event lands: the device can change between them.
    const slots = () => DEVICES[state.device].slots;
    const open = () => expanded.has(f.id) && !DEVICES[state.device].phone;
    // "Shown" for the demo's choices: the rows in the card's first slots.
    const firstRows = () => new Set(pick(f, slots(), open()).slice(0, slots()));
    const finish = () => {
      const shown = pick(f, slots(), open());
      const x = shown.find((y) => WORKING.has(y.status)) || f.subs.find((y) => WORKING.has(y.status));
      if (!x) return;
      f.subs = f.subs.filter((y) => y !== x);
      f.finished[f.batch] = (f.finished[f.batch] || 0) + 1;
    };
    const report = () => {
      f.subs.forEach((y) => { y.t += 6; });
      const shown = firstRows();
      const x = [...f.subs].reverse().find((y) => !shown.has(y) && WORKING.has(y.status))
        || f.subs.find((y) => WORKING.has(y.status));
      if (!x) return;
      x.t = 0;
      x.activity = {
        testing: 'Run the suite again — 3 failing',
        coding: 'Editing CHANGELOG.md',
        planning: 'Searching: SubagentStop hook_event_name',
      }[x.status];
    };
    const block = () => {
      const waiting = f.subs.find((y) => y.status === 'blocked');
      if (waiting) { Object.assign(waiting, { status: 'testing', activity: 'Run the suite — 214 passed', t: 0 }); return; }
      const shown = firstRows();
      const x = [...f.subs].reverse().find((y) => !shown.has(y) && WORKING.has(y.status))
        || [...f.subs].reverse().find((y) => WORKING.has(y.status));
      // What Claude Code's Notification hook says when it asks for permission.
      if (x) Object.assign(x, { status: 'blocked', activity: 'Claude needs your permission to use Bash', t: 0 });
    };
    if (!f.subs.length && !sumDone(f)) return [start, start, finish, block];
    // After its turn a parent starts nothing; Codex never runs more than three.
    if (f.turnEnded) return [finish, report, block];
    if (f.kind === 'codex') return [finish, start, report, block];
    return [start, finish, report, block];
  }

  let plan = [];
  let playing = false;
  const playBtn = document.getElementById('play');

  async function play() {
    if (playing) return;
    playing = true;
    playBtn.disabled = true;
    playBtn.textContent = 'Playing…';
    if (played >= plan.length) { loadScenario(); plan = steps(); await paint(); }
    while (played < plan.length) {
      await wait(1100);
      plan[played]();
      played += 1;
      await paint({ animate: true });
    }
    playing = false;
    playBtn.disabled = false;
    playBtn.textContent = 'Play again';
  }

  // ---- Controls ------------------------------------------------------------

  function restart({ reveal: r = true } = {}) {
    loadScenario();
    plan = steps();
    playBtn.textContent = 'Play';
    return paint({ revealFocus: r });
  }

  document.querySelectorAll('.pv-seg').forEach((seg) => {
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || playing) return;
      const key = seg.dataset.key;
      state[key] = b.dataset.v;
      if (key === 'scenario') restart().then(() => b.focus());
      else paint({ revealFocus: key === 'device' }).then(() => b.focus());
    });
  });

  playBtn.addEventListener('click', play);
  document.getElementById('reset').addEventListener('click', () => { if (!playing) restart(); });

  // Inside the device: the footer, a row, a card, the way back.
  deviceEl.addEventListener('click', (e) => {
    if (playing) return;
    const expand = e.target.closest('[data-expand]');
    if (expand) {
      const id = expand.dataset.expand;
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      paint({ animate: true, expand: true });
      return;
    }
    const toScreen = e.target.closest('[data-screen]');
    if (toScreen) { screen = { id: toScreen.dataset.screen, sub: null }; paint(); return; }
    const row = e.target.closest('[data-open-sub]');
    if (row && !screen) {
      screen = { id: row.dataset.of, sub: row.dataset.openSub };
      paint().then(() => {
        deviceEl.querySelector('.sub.is-arrived')?.scrollIntoView({ block: 'center' });
        settleArrival();
      });
      return;
    }
    const open = e.target.closest('[data-open-card]');
    if (open) { screen = { id: open.dataset.openCard, sub: null }; paint(); return; }
    if (e.target.closest('[data-back]')) {
      screen = null;
      if (state.scenario === 'phone-session') state.scenario = 'ten';
      paint({ revealFocus: true });
    }
  });

  addEventListener('resize', scale);

  // ---- Start ---------------------------------------------------------------

  loadScenario();
  plan = steps();
  // A link can ask for the state after some of Play's events, for a capture.
  const asked = Math.min(Number(params.get('step')) || 0, plan.length);
  for (let i = 0; i < asked; i += 1) { plan[i](); played += 1; }
  if (played) playBtn.textContent = played >= plan.length ? 'Play again' : 'Play';
  paint({ revealFocus: true });
  // The web faces arrive after the first layout; the meta line is fitted again
  // in the face it will be read in.
  document.fonts?.ready.then(() => { if (DEVICES[state.device].web) paint(); });
})();
</script>
</body>
</html>
