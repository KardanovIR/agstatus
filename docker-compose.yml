services:
  dashboard:
    build: .
    image: claude-status-dashboard
    container_name: claude-status
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Override these in .env (see .env.example for docs on every variable):
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Legacy (single-tenant) mode only; ignored when MULTI_TENANT=true.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Empty = server default (0/keep-forever in legacy mode, 24h in multi mode).
      SESSION_TTL_MS: ${SESSION_TTL_MS:-}
      # Set MULTI_TENANT=true to enable workspace mode.
      MULTI_TENANT: ${MULTI_TENANT:-}
      # Multi-tenant only. Empty = server default (200).
      MAX_NEW_WORKSPACES_PER_HOUR: ${MAX_NEW_WORKSPACES_PER_HOUR:-}
      # Set TRUST_PROXY=1 when running behind a reverse proxy (e.g. the caddy
      # service below, enabled with --profile tls).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # PostgreSQL persistence (the postgres service below). Set DATABASE_URL=
      # (empty) in .env to run purely in-memory — sessions and workspaces are
      # then lost on restart. Rows are soft-deleted (flagged, never removed).
      DATABASE_URL: ${DATABASE_URL-postgres://agstatus:${POSTGRES_PASSWORD:-agstatus}@postgres:5432/agstatus}
      # APNs push notifications (optional — see docs/self-hosting.md). Put the
      # .p8 auth key in ./keys (mounted read-only at /app/keys below) and set
      # these in .env. Left unset, push is simply disabled.
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_ENV: ${APNS_ENV:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # APNs .p8 auth key lives here (see APNS_KEY_PATH above).
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 in-container while
      # node listens on IPv4 only, which reads as a permanently unhealthy app.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: claude-status-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agstatus
      POSTGRES_USER: agstatus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agstatus}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agstatus -d agstatus"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Optional TLS-terminating reverse proxy with automatic Let's Encrypt certs.
  # Enable with:  DOMAIN=status.example.com docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    container_name: claude-status-caddy
    restart: unless-stopped
    profiles:
      - tls
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

  # Optional Cloudflare Tunnel connector — publishes the dashboard with no
  # open ports (no port forwarding; a dynamic home IP or CGNAT is fine).
  # Create the tunnel in the Cloudflare Zero Trust dashboard, point its
  # public hostname at http://dashboard:3000, then enable with:
  #   TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  # TLS terminates at Cloudflare's edge, so the caddy/tls profile is not
  # needed alongside this — but do set TRUST_PROXY=1 and PUBLIC_URL.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: claude-status-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - dashboard

volumes:
  pg_data:
  caddy_data:
  caddy_config:
